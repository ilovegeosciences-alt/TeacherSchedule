name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允许你在网页上手动点击按钮运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and Prepare Project
      run: |
        # 解压你上传的压缩包到 project 文件夹
        unzip TeacherScheduleAndroid.zip -d ./project
        # 进入解压后的目录。如果压缩包内还有一层文件夹，这里会报错，需要改成对应的路径，如 cd ./project/你的文件夹名
        cd ./project
        # 赋予 Gradle 执行权限
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      working-directory: ./project # 告诉系统在这个目录下执行编译
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 自动寻找编译生成的 apk 文件并上传
        path: ./project/**/build/outputs/apk/debug/*.apk
