name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Unzip and Prepare Project
      run: |
        unzip TeacherScheduleAndroid.zip -d ./project
        # 关键修改：进入正确的子文件夹
        cd ./project/TeacherScheduleAndroid
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      # 关键修改：指定编译的工作目录也是这个子文件夹
      working-directory: ./project/TeacherScheduleAndroid
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 使用通配符查找 APK，这里保持不变，它能自动匹配到子文件夹里的结果
        path: ./project/**/build/outputs/apk/debug/*.apk
