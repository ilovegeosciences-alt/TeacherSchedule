name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Unzip and Prepare Project
      run: |
        unzip TeacherScheduleAndroid.zip -d ./project
        cd ./project/TeacherScheduleAndroid
        # 因为你的压缩包里没带 gradlew，这里使用服务器自带的 gradle 生成一份
        gradle wrapper
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      working-directory: ./project/TeacherScheduleAndroid
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ./project/**/build/outputs/apk/debug/*.apk
